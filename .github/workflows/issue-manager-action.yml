name: Issue Manager

on:
  schedule:
    - cron: "15 18 * * *"
  issue_comment:
    types:
      - created
  issues:
    types:
      - labeled
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  issue-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: khulnasoft/issue-manager-action@0.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}